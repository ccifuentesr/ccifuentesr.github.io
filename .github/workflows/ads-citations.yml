name: Update ADS publications and publish site

on:
  push:
    branches: [main]
  schedule:
    - cron: '23 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Validate ADS updaters
        run: python -m unittest discover -s tests -v
      - name: Restore most recent ADS cache
        uses: actions/cache/restore@v4
        with:
          path: |
            assets/data/ads-publications.json
            assets/data/ads-citations.json
          key: ads-records-v3-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ads-records-v3-
      - name: Refresh journal articles
        id: publications
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        env:
          ADS_API_TOKEN: ${{ secrets.ADS_API_TOKEN }}
        run: python scripts/update_ads_publications.py
      - name: Refresh citation counts
        id: citations
        if: steps.publications.outcome == 'success'
        continue-on-error: true
        env:
          ADS_API_TOKEN: ${{ secrets.ADS_API_TOKEN }}
        run: python scripts/update_ads_citations.py
      - name: Keep previous data if ADS is unavailable
        if: steps.publications.outcome == 'failure' || steps.citations.outcome == 'failure'
        run: echo '::warning::ADS refresh failed. Publishing the available cached data.'
      - name: Save refreshed ADS data
        if: steps.publications.outcome == 'success' && steps.citations.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: |
            assets/data/ads-publications.json
            assets/data/ads-citations.json
          key: ads-records-v3-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Check ADS caches
        run: |
          python -m json.tool assets/data/ads-publications.json > /dev/null
          python -m json.tool assets/data/ads-citations.json > /dev/null
      - name: Prepare static site
        run: python scripts/prepare_pages.py
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Wait for Pages artifact indexing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in {1..12}; do
            count=$(curl --fail --silent --show-error \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" \
              | python -c 'import json, sys; print(sum(a["name"] == "github-pages" for a in json.load(sys.stdin)["artifacts"]))')
            if [ "$count" = 1 ]; then
              exit 0
            fi
            sleep 10
          done
          echo 'Pages artifact was not indexed in time' >&2
          exit 1
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
