   (() => {
    const gate = document.querySelector('[data-echoes-gate]');
    const content = document.querySelector('[data-echoes-content]');
    const input = document.getElementById('echoes-password');
    const error = gate.querySelector('.echoes-gate__error');
    gate.addEventListener('submit', event => {
